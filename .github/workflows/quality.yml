name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UQTL_DATA_ROOT: ${{ github.workspace }}/data
      UQTL_LOGS_ROOT: ${{ github.workspace }}/logs
      UQTL_CACHE_ROOT: ${{ github.workspace }}/cache
      UQTL_VERIFICATION_ROOT: ${{ github.workspace }}/verification
      UQTL_EDINET_ROOT: ${{ github.workspace }}/edinet
      UQTL_PREPROCESSED_ROOT: ${{ github.workspace }}/preprocessed
      CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Setup CPU development environment
        run: |
          mkdir -p data logs cache verification edinet preprocessed
          bash scripts/setup_cpu.sh

      - name: Validate shell entrypoints
        run: bash -n scripts/setup_cpu.sh scripts/lint_changed_ts.sh

      - name: Validate runtime config
        run: task validate:runtime

      - name: Reject new TypeScript formatting or lint debt
        run: bash scripts/lint_changed_ts.sh

      - name: Audit existing TypeScript tests
        continue-on-error: true
        run: task test

      - name: Audit existing repository-wide TypeScript debt
        continue-on-error: true
        run: |
          task typecheck
          bash scripts/self_healing_lint.sh

      - name: Audit existing Python quality debt
        continue-on-error: true
        run: |
          .venv/bin/ruff check .
          .venv/bin/pyright

      - name: Explain non-blocking baseline audits
        if: always()
        run: |
          echo "Existing repository-wide test, type, lint, and Python debt is tracked in issue #20."
          echo "CPU setup, runtime configuration, shell syntax, and changed TypeScript files remain blocking."
