name: Agent format quality repair

on:
  push:
    branches:
      - agent/fix-quality-smoke-ci

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/fix-quality-smoke-ci
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install TypeScript dependencies
        working-directory: ts-agent
        run: bun install
      - name: Apply semantic and formatter fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          evidence = Path('ts-agent/src/dashboard/src/features/EvidenceRoom.tsx')
          text = evidence.read_text()
          old = '<div className="main" role="status" aria-live="polite">'
          new = '<div className="main" aria-live="polite">'
          if old not in text:
              raise SystemExit('expected EvidenceRoom live-region marker not found')
          evidence.write_text(text.replace(old, new, 1))

          status = Path('ts-agent/src/dashboard/src/features/StatusBar.tsx')
          text = status.read_text()
          old = '<header className="topbar" aria-label="AAARTS system header">'
          new = '<header className="topbar">'
          if old not in text:
              raise SystemExit('expected StatusBar header marker not found')
          status.write_text(text.replace(old, new, 1))
          PY
          cd ts-agent
          bun ./node_modules/@biomejs/biome/bin/biome check --write \
            src/dashboard/src/features/EvidenceRoom.tsx \
            src/dashboard/src/features/StatusBar.tsx
          git checkout -- bun.lock
      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ts-agent/src/dashboard/src/features/EvidenceRoom.tsx \
                  ts-agent/src/dashboard/src/features/StatusBar.tsx
          git diff --cached --check
          git commit -m 'Fix dashboard Biome regressions'
          git push origin HEAD:agent/fix-quality-smoke-ci
