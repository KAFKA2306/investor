name: Patch setup entry

on:
  push:
    branches:
      - agent/japanese-human-readme
    paths:
      - .github/workflows/patch-readme-setup-entry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/japanese-human-readme
      - name: Replace the standard setup entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Taskfile.yml")
          text = path.read_text(encoding="utf-8")
          old = '''  setup:
              desc: setup
              cmds:
                - task: deps
                - task: python:uv:sync
          '''
          new = '''  setup:
              desc: setup the standard CPU development environment
              cmds:
                - bash scripts/setup_cpu.sh
          '''
          if new in text:
              print("Taskfile setup entry is already updated")
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          else:
              raise SystemExit("expected Taskfile setup block was not found")
          PY
      - name: Commit the Taskfile change
        run: |
          if git diff --quiet -- Taskfile.yml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Taskfile.yml
          git commit -m "Route standard setup through the CPU-safe environment"
          git push origin HEAD:agent/japanese-human-readme
