name: One-shot dashboard Bun lock repair

on:
  push:
    branches:
      - fix/dashboard-audit-20261101
    paths:
      - .github/workflows/dashboard-bun-lock-once.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Regenerate Bun lock and verify both package managers
        working-directory: ts-agent/src/dashboard
        shell: bash
        run: |
          set -euo pipefail
          bun install --lockfile-only
          bun install --frozen-lockfile
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Commit only the verified Bun lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ts-agent/src/dashboard/bun.lock
          git diff --cached --quiet && { echo "Bun lock was not changed"; exit 1; }
          git commit -m "fix(security): align dashboard Bun lock with patched npm dependencies"
          git push origin HEAD:fix/dashboard-audit-20261101
