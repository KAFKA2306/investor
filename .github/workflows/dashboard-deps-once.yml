name: One-shot dashboard dependency lock repair

on:
  push:
    branches:
      - fix/dashboard-audit-20261101
    paths:
      - .github/workflows/dashboard-deps-once.yml

permissions:
  contents: write

jobs:
  regenerate-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Regenerate only dashboard dependency lock
        working-directory: ts-agent/src/dashboard
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --save-exact zod@4.6.7
          npm install --package-lock-only --save-dev --save-exact vite@7.3.7
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Commit verified lock and manifest to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ts-agent/src/dashboard/package.json ts-agent/src/dashboard/package-lock.json
          git diff --cached --quiet && { echo "No dependency change generated"; exit 1; }
          git commit -m "fix(security): update dashboard vulnerable npm dependencies"
          git push origin HEAD:fix/dashboard-audit-20261101
