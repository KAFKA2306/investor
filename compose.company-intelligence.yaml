name: investor-company-intelligence

services:
  company-intelligence-db:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CANONICAL_DB_NAME:-investor}
      POSTGRES_USER: ${CANONICAL_DB_USER:-investor}
      POSTGRES_PASSWORD: ${CANONICAL_DB_PASSWORD:?set CANONICAL_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "${COMPANY_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - company_intelligence_pgdata:/var/lib/postgresql
      - ./db/company_intelligence:/docker-entrypoint-initdb.d:ro

  company-intelligence-api:
    build:
      context: ./services/company-intelligence
    restart: unless-stopped
    depends_on:
      company-intelligence-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${CANONICAL_DB_USER:-investor}:${CANONICAL_DB_PASSWORD}@company-intelligence-db:5432/${CANONICAL_DB_NAME:-investor}
      PORT: 8080
      NODE_ENV: production
      EDINET_API_KEY: ${EDINET_API_KEY:-}
    ports:
      - "${COMPANY_API_PORT:-8080}:8080"

volumes:
  company_intelligence_pgdata:
